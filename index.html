<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Splash Designer</title>
  <style>
    html,body{margin:0;height:100%;background:#111;overflow:hidden}
    canvas{display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    .audio-start{position:fixed;inset:0;z-index:20;display:grid;width:100%;height:100%;place-items:center;border:0;padding:0;background:rgba(8,12,12,.2);color:#fff;opacity:1;appearance:none;-webkit-appearance:none;transition:opacity .22s ease,background .22s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:default}
    .audio-start[data-state="loading"]{background:#050708}
    .audio-start[data-state="ready"]{background:rgba(1,3,4,.78)}
    .audio-start[data-state="preparing"]{background:rgba(1,3,4,.78)}
    .audio-start[hidden]{display:none}
    .audio-start.is-leaving{opacity:0;pointer-events:none}
    .audio-start[data-state="ready"]{cursor:pointer}
    .audio-start-label{font:600 clamp(22px,5.5vw,34px)/1.2 system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.82)}
    .audio-start[data-state="ready"] .audio-start-label{animation:start-pulse 1.35s ease-in-out infinite}
    @keyframes start-pulse{0%,100%{opacity:1}50%{opacity:.26}}
    .site-credit{position:fixed;right:14px;bottom:10px;z-index:10;color:rgba(235,238,236,.82);font:12px/1.4 system-ui,sans-serif;text-shadow:0 1px 3px #000;user-select:none}
    .site-credit em{font-style:italic}
    .site-credit button{border:0;padding:2px 3px;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
    .credits-dialog{overflow:visible;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:0;background:#101719;color:#edf2ef;box-shadow:0 20px 70px rgba(0,0,0,.55);width:min(88vw,360px)}
    .credits-dialog:focus{outline:none}
    .credits-dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
    .credits-panel{padding:22px}
    .credits-viewport{max-height:min(56vh,360px);overflow:hidden;scroll-behavior:auto}
    .credits-roll section+section{margin-top:30px}
    .credits-roll h3{margin:0 0 14px;color:rgba(237,242,239,.72);font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.16em}
    .credits-panel ul{margin:0;padding:0;list-style:none;color:#f3ecdc;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
    .credits-panel li+li{margin-top:10px}
    .credits-panel a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <button class="audio-start" id="audio-start" type="button" data-state="loading" disabled>
    <span class="audio-start-label" id="audio-start-label" aria-live="polite">Loading...</span>
  </button>
  <script type="module" src="./main.js?v=0024c"></script>
</body>
</html>
