<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Splash Designer</title>
  <style>
    html,body{margin:0;height:100%;background:#111;overflow:hidden}
    canvas{display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    .audio-start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,12,12,.2);transition:opacity .22s ease;touch-action:manipulation}
    .audio-start[hidden]{display:none}
    .audio-start.is-leaving{opacity:0;pointer-events:none}
    .audio-start button{border:1px solid rgba(255,255,255,.62);border-radius:999px;padding:12px 25px;background:rgba(22,30,29,.76);color:#fff;font:600 15px/1.2 system-ui,sans-serif;letter-spacing:.08em;box-shadow:0 5px 22px rgba(0,0,0,.32);backdrop-filter:blur(5px);-webkit-tap-highlight-color:transparent;cursor:pointer}
    .site-credit{position:fixed;right:14px;bottom:10px;z-index:10;color:rgba(235,238,236,.82);font:12px/1.4 system-ui,sans-serif;text-shadow:0 1px 3px #000;user-select:none}
    .site-credit em{font-style:italic}
    .site-credit button{border:0;padding:2px 3px;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
    .credits-dialog{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:0;background:#101719;color:#edf2ef;box-shadow:0 20px 70px rgba(0,0,0,.55);width:min(88vw,360px)}
    .credits-dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
    .credits-panel{padding:20px 22px 18px}
    .credits-panel h2{margin:0 0 14px;font:600 18px/1.3 system-ui,sans-serif}
    .credits-panel ul{margin:0;padding:0;list-style:none}
    .credits-panel li+li{margin-top:10px}
    .credits-panel a{color:#bcdff0;text-underline-offset:3px}
    .credits-close{display:block;margin:20px 0 0 auto;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 16px;background:rgba(255,255,255,.08);color:inherit;cursor:pointer}
  </style>
</head>
<body>
  <div class="audio-start" id="audio-start">
    <button type="button" id="audio-start-button">タップして入る</button>
  </div>
  <script type="module" src="./main.js?v=0017p"></script>
</body>
</html>
